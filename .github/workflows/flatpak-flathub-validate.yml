name: Flatpak (Flathub manifest) validation

# Valida o manifest que vai ser submetido ao Flathub — fontes remotas, runtime
# 26.08, sem `type: dir`. Corre em cada push/PR que mexa em `flatpak/**`.
on:
  workflow_dispatch:
  push:
    branches: ['flathub-manifest']
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-flathub-validate.yml'
  pull_request:
    paths:
      - 'flatpak/**'
      - '.github/workflows/flatpak-flathub-validate.yml'

concurrency:
  group: flatpak-validate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MANIFEST: flatpak/tv.megacubo.Megacubo.yml

    steps:
      - uses: actions/checkout@v4

      - name: Instalar flatpak + linter + appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils appstream
          flatpak --version

      - name: Adicionar remote flathub e runtimes
        run: |
          set -euo pipefail
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.freedesktop.Platform//26.08 \
            org.freedesktop.Sdk//26.08 \
            org.electronjs.Electron2.BaseApp//26.08
          flatpak install --user --noninteractive -y flathub org.flatpak.Builder

      - name: Validar AppStream
        run: |
          set -euo pipefail
          appstreamcli validate --no-net --explain \
            flatpak/tv.megacubo.Megacubo.metainfo.xml

      - name: Compilar com flatpak-builder
        run: |
          set -euo pipefail
          flatpak-builder --user --force-clean --repo=repo \
            --install-deps-from=flathub \
            build-dir "$MANIFEST"
          flatpak build-bundle repo megacubo.flatpak tv.megacubo.Megacubo
          ls -lh megacubo.flatpak

      # Cada verificacao aqui falha o job: `test ... && echo` deixa passar uma
      # ausencia, porque o `test` nao e o ultimo comando da lista e o `set -e`
      # ignora-o. Foi assim que o `megacubo.real` em falta passou verde.
      - name: Instalar o bundle e inspecionar o conteudo
        run: |
          set -euo pipefail
          flatpak install --user --noninteractive -y --bundle megacubo.flatpak
          flatpak info --user tv.megacubo.Megacubo
          du -sh build-dir/files build-dir/files/megacubo
          find build-dir/files/megacubo | wc -l
          find build-dir/files/megacubo -maxdepth 1 | sort
          faltas=0
          exigir_exec() {
            if [ -x "$1" ]; then echo "OK $1"; else echo "::error::falta o executavel $1"; faltas=1; fi
          }
          exigir_dir() {
            if [ -d "$1" ]; then echo "OK $1"; else echo "::error::falta o diretorio $1"; faltas=1; fi
          }
          exigir_ausente() {
            if [ -e "$1" ]; then echo "::error::nao devia estar no pacote: $1"; faltas=1; fi
          }
          exigir_exec build-dir/files/bin/megacubo
          exigir_exec build-dir/files/megacubo/megacubo.real
          exigir_exec build-dir/files/megacubo/libffmpeg.so
          exigir_dir build-dir/files/megacubo/resources/app
          exigir_ausente build-dir/files/megacubo/chrome-sandbox
          exigir_ausente build-dir/files/megacubo/install.sh
          exigir_ausente build-dir/files/megacubo/megacubo
          exit "$faltas"

      - name: Validar manifest (flatpak-builder-lint)
        run: |
          set -euo pipefail
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            manifest "$MANIFEST"

      # O `appstreamcli compose` só mantém uma captura quando o URL responde uma
      # imagem. O Cloudflare de `static.megacubo.tv` serve uma página HTML com
      # 200 a IPs de datacenter (o runner perdia duas das três), por isso o
      # metainfo aponta para `raw.githubusercontent.com`.
      - name: As capturas do metainfo respondem uma imagem
        run: |
          set -euo pipefail
          erro=0
          for u in $(grep -o 'https://[^<]*\.png' flatpak/tv.megacubo.Megacubo.metainfo.xml); do
            lido=$(curl -sS -o /tmp/sc.bin -w "%{http_code} %{content_type}" --max-time 40 "$u" || echo "000 -")
            echo "$lido $u"
            case "$lido" in
              "200 image/png") ;;
              *) echo "::error::$u nao devolveu 200 image/png"; erro=1 ;;
            esac
          done
          exit "$erro"

      - name: O catalogo composto tem as tres capturas
        run: |
          set -euo pipefail
          sudo chown -R "$USER" build-dir
          n=$(zcat build-dir/files/share/app-info/xmls/tv.megacubo.Megacubo.xml.gz | grep -c '<image ' || true)
          echo "capturas no catalogo composto: $n"
          test "$n" -ge 3

      - name: Validar o build final (flatpak-builder-lint)
        run: |
          set -euo pipefail
          sudo chown -R "$USER" build-dir
          # `appstream-external-screenshot-url` é o esperado aqui: quem espelha as
          # capturas para dl.flathub.org/media é o pipeline do Flathub, e é lá que
          # a verificação de espelho é saltada. As restantes falhas continuam a
          # derrubar o job.
          saida=$(flatpak run --command=flatpak-builder-lint org.flatpak.Builder \
            builddir build-dir || true)
          echo "$saida"
          if [ -z "$saida" ]; then
            echo "::error::o flatpak-builder-lint nao devolveu JSON"
            exit 1
          fi
          restantes=$(echo "$saida" | jq '[.errors[]? | select(. != "appstream-external-screenshot-url")] | length')
          if [ "$restantes" -ne 0 ]; then
            echo "::error::$restantes erro(s) do linter alem do esperado"
            exit 1
          fi

      - name: Guardar o bundle
        uses: actions/upload-artifact@v4
        with:
          name: megacubo-flathub-flatpak
          path: megacubo.flatpak
          if-no-files-found: error
